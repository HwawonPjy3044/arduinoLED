<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RGB LED 원격 제어</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: sans-serif; max-width: 460px; margin: 0 auto; padding: 20px; text-align: center; color: #222; }
  h2 { margin: 8px 0 14px; }
  .chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 14px; }
  .chip { font-size: 13px; padding: 4px 12px; border-radius: 14px; background: #ddd; color: #555; white-space: nowrap; }
  .chip.ok { background: #d8f3dc; color: #1b6b32; }
  .chip.bad { background: #fde2e2; color: #a12; }
  #login input { display: block; width: 100%; font-size: 16px; padding: 12px; margin: 10px 0; border: 1px solid #bbb; border-radius: 8px; }
  #login button, #logout { font-size: 16px; padding: 12px 30px; border: 0; border-radius: 8px; background: #2a7de1; color: #fff; }
  #logout { background: #999; font-size: 13px; padding: 6px 16px; margin-top: 26px; }
  #msg { min-height: 20px; color: #a12; font-size: 14px; margin: 8px 0; }
  #panel { display: none; }
  #allOff { display: block; width: 100%; font-size: 16px; padding: 12px; margin-bottom: 16px; border: 0; border-radius: 8px; background: #c0392b; color: #fff; }
  #empty { color: #777; font-size: 14px; line-height: 1.6; padding: 24px 8px; }

  .card { border: 1px solid #ddd; border-radius: 12px; margin: 14px 0; text-align: left; background: #fff; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px; cursor: pointer; }
  .title { min-width: 0; }
  .title b { display: block; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .title small { color: #888; font-size: 12px; }
  .body { padding: 0 14px 14px; text-align: center; }
  .body.hide { display: none; }
  .sw { height: 56px; border-radius: 10px; background: #222; margin-bottom: 12px; }
  .pw { font-size: 18px; padding: 9px 32px; border: 0; border-radius: 22px; background: #999; color: #fff; }
  .pw.on { background: #2a7de1; }
  .row { display: flex; align-items: center; gap: 10px; margin: 12px 0; }
  .row b { width: 20px; text-align: center; }
  .row input { flex: 1; height: 26px; }
  .row span { width: 36px; text-align: right; }
  .tools { display: flex; gap: 8px; justify-content: center; margin-top: 8px; }
  .tools button { font-size: 12px; padding: 6px 12px; border: 1px solid #bbb; border-radius: 8px; background: #f6f6f6; color: #444; }
  .tools .del { color: #a12; border-color: #e3b0b0; }

  .sched { margin-top: 16px; padding-top: 14px; border-top: 1px dashed #ddd; }
  .sched h4 { margin: 0 0 8px; font-size: 14px; color: #555; }
  .sched-empty { color: #999; font-size: 13px; padding: 6px 0; }
  .sched-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid #e3e3e3; border-radius: 8px; margin-bottom: 6px; background: #fafafa; }
  .sched-item.off { opacity: .5; }
  .sched-item .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .sched-item .desc { flex: 1; font-size: 13px; line-height: 1.4; }
  .sched-item button { font-size: 11px; padding: 4px 8px; border: 1px solid #bbb; border-radius: 6px; background: #fff; color: #555; }
  .sched-item .sdel { color: #a12; border-color: #e3b0b0; }
  .addSched { width: 100%; font-size: 13px; padding: 8px; margin-top: 6px; border: 1px dashed #999; border-radius: 8px; background: #f6f6f6; color: #444; }

  .schedForm { display: none; margin-top: 10px; padding: 12px; border: 1px solid #ddd; border-radius: 10px; background: #f9f9fb; text-align: left; }
  .schedForm.show { display: block; }
  .schedForm .fr { display: flex; align-items: center; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
  .schedForm .fr label { font-size: 13px; color: #555; width: 66px; flex: none; }
  .schedForm input[type=time], .schedForm input[type=date] { font-size: 14px; padding: 5px; border: 1px solid #ccc; border-radius: 6px; }
  .schedForm .dow { display: flex; gap: 4px; flex-wrap: wrap; }
  .schedForm .dow label { width: auto; display: flex; align-items: center; gap: 2px; font-size: 12px; background: #fff; border: 1px solid #ccc; border-radius: 6px; padding: 4px 6px; }
  .schedForm .dow input { margin: 0; }
  .schedForm .repeatMode { display: flex; gap: 10px; font-size: 13px; }
  .schedForm .btns { display: flex; gap: 8px; margin-top: 10px; }
  .schedForm .btns button { flex: 1; font-size: 14px; padding: 9px; border: 0; border-radius: 8px; }
  .schedForm .save { background: #2a7de1; color: #fff; }
  .schedForm .cancel { background: #ddd; color: #444; }
  .schedForm .err { color: #a12; font-size: 12px; min-height: 16px; }
</style>
</head>
<body>

<h2>RGB LED 원격 제어</h2>
<div class="chips">
  <span class="chip" id="chipBroker">브로커: 연결 안 됨</span>
  <span class="chip" id="chipCount">기기: 확인 전</span>
</div>

<!-- 로그인: 계정 정보는 코드에 넣지 않고 접속할 때 입력받는다 -->
<form id="login">
  <input id="user" type="text" placeholder="계정 이름" autocomplete="username" required>
  <input id="pass" type="password" placeholder="비밀번호" autocomplete="current-password" required>
  <button type="submit">접속</button>
</form>
<div id="msg"></div>

<!-- 제어 화면: 접속에 성공하면 나타난다. 기기 카드는 자동으로 추가된다 -->
<div id="panel">
  <button id="allOff">모두 끄기</button>
  <div id="empty">아직 접속한 기기가 없습니다.<br>보드를 켜면 이곳에 자동으로 나타납니다.</div>
  <div id="list"></div>
  <button id="logout">접속 끊기</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5/dist/mqtt.min.js"></script>
<script>
// ===== 사용자 설정 =====
// HiveMQ Cloud 클러스터 주소 (https:// 는 빼고 적기). 아두이노의 arduino_secrets.h와 같은 값
const BROKER_HOST = "3d11f01f0aee4240b735448dac992c07.s1.eu.hivemq.cloud";
// =======================

// 토픽 이름: 아두이노 스케치(led_mqtt.ino)와 같아야 한다. <ID>는 기기 ID
//   led/<ID>/power   전원 명령 "1" 또는 "0"
//   led/<ID>/color   색 명령 "R,G,B"
//   led/<ID>/schedule 예약 목록. 한 줄에 하나씩. "id,사용,켜는시,켜는분,끄는시,끄는분,요일,시작일,종료일,R,G,B"
//                      (아두이노 스케치의 parseSchedule()과 형식이 같아야 한다. 이 웹페이지가 발행, 브로커가 보관)
//   led/<ID>/state   현재 상태 "전원,R,G,B"   (아두이노가 발행)
//   led/<ID>/online  접속 여부 "1" 또는 "0"    (아두이노가 발행)
//   led/<ID>/name    별명                      (이 웹페이지가 발행, 브로커가 보관)
//   led/all/power    모든 기기 전원 명령 (모두 끄기)
const DOW_LABELS = ["일", "월", "화", "수", "목", "금", "토"];
const DOW_BITS = [1, 2, 4, 8, 16, 32, 64];  // 일1 월2 화4 수8 목16 금32 토64 (아두이노와 동일)
const TOPIC_ALL_POWER = "led/all/power";
const topicOf = (id, kind) => `led/${id}/${kind}`;

const $ = id => document.getElementById(id);
const COLORS = ["#e33", "#2a2", "#33e"];  // R, G, B 글자 색
const LABELS = ["R", "G", "B"];

let client = null;
const devices = {};  // 기기 ID -> { id, el, name, online, on, rgb, touch, timer, schedules, editingSchedId }

// ===== 예약(스케줄) 문자열 <-> 객체 변환 =====
// 브로커에 저장되는 형식: 한 줄에 하나씩, "id,사용,켜는시,켜는분,끄는시,끄는분,요일,시작일,종료일,R,G,B"
// (아두이노 스케치의 parseSchedule()과 반드시 같은 순서여야 한다)

// 예약 목록 문자열(payload) -> 예약 객체 배열
function parseScheduleText(payload) {
  const list = [];
  (payload || "").split("\n").forEach(line => {
    line = line.trim();
    if (!line) return;
    const tok = line.split(",");
    if (tok.length !== 12) return;
    const n = i => Number(tok[i]);
    list.push({
      sid: tok[0] || String(Date.now()) + Math.random().toString(16).slice(2, 6),
      enabled: n(1) === 1,
      onH: n(2), onM: n(3), offH: n(4), offM: n(5),
      days: n(6),
      startDate: n(7), endDate: n(8),
      r: n(9), g: n(10), b: n(11)
    });
  });
  return list;
}

// 예약 객체 배열 -> 브로커에 보낼 문자열
function scheduleToText(list) {
  return list.map(a => [
    a.sid, a.enabled ? 1 : 0, a.onH, a.onM, a.offH, a.offM,
    a.days, a.startDate, a.endDate, a.r, a.g, a.b
  ].join(",")).join("\n");
}

const pad2 = n => String(n).padStart(2, "0");
const hm = (h, m) => `${pad2(h)}:${pad2(m)}`;

// YYYYMMDD 숫자 <-> <input type=date>의 "YYYY-MM-DD" 문자열
function dateNumToInput(n) {
  if (!n) return "";
  const s = String(n);
  return `${s.slice(0, 4)}-${s.slice(4, 6)}-${s.slice(6, 8)}`;
}
function dateInputToNum(s) {
  return s ? Number(s.replaceAll("-", "")) : 0;
}

// 예약 하나를 사람이 읽을 문장으로 표현
function describeAlarm(a) {
  const when = a.days === 0
    ? (a.startDate ? `${String(a.startDate).slice(0, 4)}.${String(a.startDate).slice(4, 6)}.${String(a.startDate).slice(6, 8)} 하루만` : "날짜 미지정")
    : "매주 " + DOW_BITS.map((bit, i) => (a.days & bit) ? DOW_LABELS[i] : "").join("");
  let period = "";
  if (a.days !== 0 && (a.startDate || a.endDate)) {
    period = ` (${a.startDate ? dateNumToInput(a.startDate) : "제한없음"} ~ ${a.endDate ? dateNumToInput(a.endDate) : "제한없음"})`;
  }
  return `${when} · ${hm(a.onH, a.onM)} 켜짐 → ${hm(a.offH, a.offM)} 꺼짐${period}`;
}

// 칩(상태 표시) 문구와 색 바꾸기 (상태 색만 바꾸고, 다른 클래스(.st 등)는 그대로 둔다)
function setChip(el, text, cls) {
  el.textContent = text;
  el.classList.remove("ok", "bad");
  if (cls) el.classList.add(cls);
}

// 상단의 "기기: n대 접속 중" 표시와 빈 화면 안내 갱신
function updateSummary() {
  const list = Object.values(devices);
  const online = list.filter(d => d.online).length;
  setChip($("chipCount"), `기기: ${online}/${list.length}대 접속 중`, online > 0 ? "ok" : "");
  $("empty").style.display = list.length ? "none" : "block";
}

// 카드를 별명(없으면 ID) 순으로 다시 정렬
function sortCards() {
  Object.values(devices)
    .sort((a, b) => (a.name || a.id).localeCompare(b.name || b.id, "ko"))
    .forEach(d => $("list").appendChild(d.el));
}

// 기기 카드 화면 갱신
function paint(d) {
  const el = d.el;
  el.querySelector(".nm").textContent = d.name || d.id;
  el.querySelector(".idl").textContent = d.name ? `ID: ${d.id}` : "";

  const st = el.querySelector(".st");
  if (d.online === null) setChip(st, "확인 전", "");
  else setChip(st, d.online ? "접속 중" : "꺼져 있음", d.online ? "ok" : "bad");

  el.querySelector(".sw").style.background =
    d.on ? `rgb(${d.rgb[0]},${d.rgb[1]},${d.rgb[2]})` : "#222";
  const pw = el.querySelector(".pw");
  pw.textContent = d.on ? "ON" : "OFF";
  pw.className = "pw" + (d.on ? " on" : "");

  el.querySelectorAll(".row").forEach((row, i) => {
    row.querySelector("input").value = d.rgb[i];
    row.querySelector("span").textContent = d.rgb[i];
  });

  // 접속 중인 기기는 목록에서 삭제할 수 없다 (접속이 끊긴 기기만 삭제 가능)
  el.querySelector(".del").style.display = d.online ? "none" : "inline-block";
}

// 발행 도우미
function publish(topic, text, retain) {
  if (client && client.connected) client.publish(topic, text, { retain: !!retain, qos: 1 });
}

// 기기 카드를 만든다 (기기 ID나 별명은 화면에 textContent로만 넣는다)
function createDevice(id) {
  const el = document.createElement("section");
  el.className = "card";
  el.innerHTML = `
    <div class="head">
      <div class="title"><b class="nm"></b><small class="idl"></small></div>
      <span class="chip st">확인 전</span>
    </div>
    <div class="body">
      <div class="sw"></div>
      <button class="pw">OFF</button>
      ${LABELS.map((l, i) => `
        <div class="row"><b style="color:${COLORS[i]}">${l}</b>
          <input type="range" min="0" max="255" value="255"><span>255</span></div>`).join("")}
      <div class="tools">
        <button class="ren">별명 바꾸기</button>
        <button class="del">목록에서 삭제</button>
      </div>

      <div class="sched">
        <h4>예약 (시간 제어)</h4>
        <div class="schedList"></div>
        <button class="addSched">+ 예약 추가</button>

        <div class="schedForm">
          <div class="fr">
            <label>켜는 시각</label><input type="time" class="f-on" value="18:00">
            <label>끄는 시각</label><input type="time" class="f-off" value="23:00">
          </div>
          <div class="fr">
            <label>반복</label>
            <div class="repeatMode">
              <label><input type="radio" name="rep-${id}" class="f-rep" value="weekly" checked>매주</label>
              <label><input type="radio" name="rep-${id}" class="f-rep" value="once">하루만</label>
            </div>
          </div>
          <div class="fr f-dowRow">
            <label>요일</label>
            <div class="dow">
              ${DOW_LABELS.map((l, i) => `<label><input type="checkbox" class="f-dow" value="${DOW_BITS[i]}">${l}</label>`).join("")}
            </div>
          </div>
          <div class="fr f-onceRow" style="display:none">
            <label>날짜</label><input type="date" class="f-onceDate">
          </div>
          <div class="fr">
            <label>기간(선택)</label><input type="date" class="f-start"><span>~</span><input type="date" class="f-end">
          </div>
          <div class="fr">
            <label>색상</label><input type="color" class="f-color" value="#ffffff">
            <button type="button" class="f-useCurrent" style="font-size:11px;padding:4px 8px;border:1px solid #bbb;border-radius:6px;background:#fff;">지금 색 사용</button>
          </div>
          <div class="fr">
            <label>사용</label><input type="checkbox" class="f-enabled" checked>
          </div>
          <div class="err"></div>
          <div class="btns">
            <button type="button" class="cancel">취소</button>
            <button type="button" class="save">저장</button>
          </div>
        </div>
      </div>
    </div>`;

  const d = { id, el, name: "", online: null, on: false, rgb: [255, 255, 255], touch: 0, timer: null, schedules: [], editingSchedId: null };

  // 머리 부분을 누르면 카드를 접거나 편다
  el.querySelector(".head").addEventListener("click", () => el.querySelector(".body").classList.toggle("hide"));

  // 전원 버튼 (색은 바꾸지 않는다)
  el.querySelector(".pw").addEventListener("click", () => {
    d.touch = Date.now();
    d.on = !d.on;
    paint(d);
    publish(topicOf(id, "power"), d.on ? "1" : "0");
  });

  // 슬라이드 바: 움직일 때마다 화면을 바꾸고, 0.12초에 한 번만 최신 색을 전송 (전원은 바꾸지 않는다)
  el.querySelectorAll(".row input").forEach((input, i) => {
    input.addEventListener("input", () => {
      d.touch = Date.now();
      d.rgb[i] = Number(input.value);
      paint(d);
      if (d.timer) return;
      d.timer = setTimeout(() => {
        d.timer = null;
        publish(topicOf(id, "color"), d.rgb.join(","));
      }, 120);
    });
  });

  // 별명 바꾸기: 브로커에 보관되므로 다른 기기(휴대폰 등)에서도 같은 이름으로 보인다
  el.querySelector(".ren").addEventListener("click", () => {
    const input = prompt(`"${id}" 기기의 별명을 입력하세요. (비우면 별명 삭제)`, d.name);
    if (input === null) return;
    publish(topicOf(id, "name"), input.trim(), true);
  });

  // 목록에서 삭제: 보관 중인 상태·접속·별명 메시지를 지운다. 기기가 다시 접속하면 자동으로 나타난다.
  el.querySelector(".del").addEventListener("click", () => {
    if (!confirm(`"${d.name || id}" 기기를 목록에서 삭제할까요?\n(다시 접속하면 자동으로 나타납니다)`)) return;
    removeDevice(id);
    ["online", "state", "name", "schedule"].forEach(kind => publish(topicOf(id, kind), "", true));
  });

  // ===== 예약(시간 제어) UI =====
  const form = el.querySelector(".schedForm");
  const fOn = el.querySelector(".f-on"), fOff = el.querySelector(".f-off");
  const fDowRow = el.querySelector(".f-dowRow"), fOnceRow = el.querySelector(".f-onceRow");
  const fOnceDate = el.querySelector(".f-onceDate");
  const fStart = el.querySelector(".f-start"), fEnd = el.querySelector(".f-end");
  const fColor = el.querySelector(".f-color"), fEnabled = el.querySelector(".f-enabled");
  const fErr = el.querySelector(".err");

  // 모든 예약을 아두이노에 보낼 문자열로 합쳐 retain 발행 (비었으면 빈 문자열로 발행해서 지운다)
  function publishSchedules() {
    publish(topicOf(id, "schedule"), scheduleToText(d.schedules), true);
  }

  // 예약 목록 화면 갱신
  function renderSchedules() {
    const box = el.querySelector(".schedList");
    if (d.schedules.length === 0) {
      box.innerHTML = `<div class="sched-empty">등록된 예약이 없습니다.</div>`;
      return;
    }
    box.innerHTML = "";
    d.schedules.forEach(a => {
      const item = document.createElement("div");
      item.className = "sched-item" + (a.enabled ? "" : " off");
      item.innerHTML = `
        <span class="dot" style="background:rgb(${a.r},${a.g},${a.b})"></span>
        <span class="desc"></span>
        <button type="button" class="stoggle">${a.enabled ? "끄기" : "켜기"}</button>
        <button type="button" class="sedit">수정</button>
        <button type="button" class="sdel">삭제</button>`;
      item.querySelector(".desc").textContent = describeAlarm(a);
      item.querySelector(".stoggle").addEventListener("click", () => {
        a.enabled = !a.enabled;
        publishSchedules();
        renderSchedules();
      });
      item.querySelector(".sedit").addEventListener("click", () => openForm(a));
      item.querySelector(".sdel").addEventListener("click", () => {
        if (!confirm("이 예약을 삭제할까요?")) return;
        d.schedules = d.schedules.filter(x => x.sid !== a.sid);
        publishSchedules();
        renderSchedules();
      });
      box.appendChild(item);
    });
  }
  d.renderSchedules = renderSchedules;

  // 폼 열기: a가 있으면 수정, 없으면 새로 추가
  function openForm(a) {
    d.editingSchedId = a ? a.sid : null;
    fErr.textContent = "";
    if (a) {
      fOn.value = hm(a.onH, a.onM);
      fOff.value = hm(a.offH, a.offM);
      form.querySelector(`.f-rep[value="${a.days === 0 ? "once" : "weekly"}"]`).checked = true;
      el.querySelectorAll(".f-dow").forEach(cb => cb.checked = !!(a.days & Number(cb.value)));
      fOnceDate.value = a.days === 0 ? dateNumToInput(a.startDate) : "";
      fStart.value = a.days !== 0 ? dateNumToInput(a.startDate) : "";
      fEnd.value = a.days !== 0 ? dateNumToInput(a.endDate) : "";
      const toHex = v => v.toString(16).padStart(2, "0");
      fColor.value = `#${toHex(a.r)}${toHex(a.g)}${toHex(a.b)}`;
      fEnabled.checked = a.enabled;
    } else {
      fOn.value = "18:00"; fOff.value = "23:00";
      form.querySelector('.f-rep[value="weekly"]').checked = true;
      el.querySelectorAll(".f-dow").forEach(cb => cb.checked = false);
      fOnceDate.value = ""; fStart.value = ""; fEnd.value = "";
      const toHex = v => v.toString(16).padStart(2, "0");
      fColor.value = `#${toHex(d.rgb[0])}${toHex(d.rgb[1])}${toHex(d.rgb[2])}`;
      fEnabled.checked = true;
    }
    updateRepeatVisibility();
    form.classList.add("show");
    el.querySelector(".body").classList.remove("hide");
    form.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
  function closeForm() {
    form.classList.remove("show");
    d.editingSchedId = null;
  }
  function updateRepeatVisibility() {
    const weekly = form.querySelector('.f-rep[value="weekly"]').checked;
    fDowRow.style.display = weekly ? "flex" : "none";
    fOnceRow.style.display = weekly ? "none" : "flex";
  }
  el.querySelectorAll(".f-rep").forEach(r => r.addEventListener("change", updateRepeatVisibility));

  el.querySelector(".addSched").addEventListener("click", () => {
    if (d.schedules.length >= 8) { alert("예약은 기기마다 최대 8개까지 등록할 수 있습니다."); return; }
    openForm(null);
  });
  el.querySelector(".f-useCurrent").addEventListener("click", () => {
    const toHex = v => v.toString(16).padStart(2, "0");
    fColor.value = `#${toHex(d.rgb[0])}${toHex(d.rgb[1])}${toHex(d.rgb[2])}`;
  });
  el.querySelector(".cancel").addEventListener("click", closeForm);

  el.querySelector(".save").addEventListener("click", () => {
    fErr.textContent = "";
    const weekly = form.querySelector('.f-rep[value="weekly"]').checked;
    if (!fOn.value || !fOff.value) { fErr.textContent = "켜는 시각과 끄는 시각을 입력하세요."; return; }
    const [onH, onM] = fOn.value.split(":").map(Number);
    const [offH, offM] = fOff.value.split(":").map(Number);
    if (onH === offH && onM === offM) { fErr.textContent = "켜는 시각과 끄는 시각이 같을 수 없습니다."; return; }

    let days = 0, startDate = 0, endDate = 0;
    if (weekly) {
      el.querySelectorAll(".f-dow").forEach(cb => { if (cb.checked) days |= Number(cb.value); });
      if (days === 0) { fErr.textContent = "매주 반복은 요일을 하나 이상 선택하세요."; return; }
      startDate = dateInputToNum(fStart.value);
      endDate = dateInputToNum(fEnd.value);
    } else {
      if (!fOnceDate.value) { fErr.textContent = "실행할 날짜를 선택하세요."; return; }
      startDate = dateInputToNum(fOnceDate.value);
      endDate = 0;
    }
    if (startDate && endDate && startDate > endDate) { fErr.textContent = "시작일이 종료일보다 늦을 수 없습니다."; return; }

    const hex = fColor.value.replace("#", "");
    const r = parseInt(hex.slice(0, 2), 16), g = parseInt(hex.slice(2, 4), 16), b = parseInt(hex.slice(4, 6), 16);

    const alarm = {
      sid: d.editingSchedId || (String(Date.now()) + Math.random().toString(16).slice(2, 6)),
      enabled: fEnabled.checked,
      onH, onM, offH, offM, days, startDate, endDate, r, g, b
    };

    if (d.editingSchedId) {
      const i = d.schedules.findIndex(x => x.sid === d.editingSchedId);
      if (i >= 0) d.schedules[i] = alarm; else d.schedules.push(alarm);
    } else {
      if (d.schedules.length >= 8) { fErr.textContent = "예약은 최대 8개까지 등록할 수 있습니다."; return; }
      d.schedules.push(alarm);
    }
    publishSchedules();
    renderSchedules();
    closeForm();
  });

  devices[id] = d;
  $("list").appendChild(el);
  paint(d);
  renderSchedules();
  sortCards();
  updateSummary();
  return d;
}

// 화면에서 기기 카드 제거
function removeDevice(id) {
  const d = devices[id];
  if (!d) return;
  if (d.timer) clearTimeout(d.timer);
  d.el.remove();
  delete devices[id];
  updateSummary();
}

// 브로커에서 온 메시지 처리
function onMessage(topic, payload) {
  const parts = topic.split("/");
  if (parts.length !== 3 || parts[0] !== "led") return;
  const id = parts[1], kind = parts[2];
  if (id === "all") return;
  const text = payload.toString();

  // 빈 메시지는 "지워졌다"는 뜻이다. 새 카드는 만들지 않는다.
  if (text === "") {
    if (kind === "online") removeDevice(id);
    else if (kind === "name" && devices[id]) { devices[id].name = ""; paint(devices[id]); sortCards(); }
    else if (kind === "schedule" && devices[id]) { devices[id].schedules = []; devices[id].renderSchedules(); }
    return;
  }

  const d = devices[id] || createDevice(id);

  if (kind === "online") {
    d.online = (text === "1");
    paint(d);
    updateSummary();
  } else if (kind === "state") {
    // 슬라이드 바를 움직이는 동안에는 화면이 튀지 않도록 상태 반영을 잠시 미룬다
    if (Date.now() - d.touch < 1500) return;
    const p = text.split(",").map(Number);
    if (p.length !== 4 || p.some(isNaN)) return;
    d.on = (p[0] === 1);
    d.rgb = [p[1], p[2], p[3]];
    paint(d);
  } else if (kind === "name") {
    d.name = text;
    paint(d);
    sortCards();
  } else if (kind === "schedule") {
    // 다른 화면(휴대폰 등)에서 예약을 바꾼 경우에도 최신 목록을 반영한다.
    // 지금 이 카드에서 폼을 열어 수정 중이면 화면이 튀지 않도록 목록만 갱신한다.
    d.schedules = parseScheduleText(text);
    d.renderSchedules();
  }
}

// 접속 화면 <-> 제어 화면 전환
function showPanel(show) {
  $("panel").style.display = show ? "block" : "none";
  $("login").style.display = show ? "none" : "block";
}

// 화면의 기기 카드를 모두 비운다
function clearDevices() {
  Object.keys(devices).forEach(removeDevice);
  updateSummary();
}

// 접속
$("login").addEventListener("submit", e => {
  e.preventDefault();
  $("msg").textContent = "";
  setChip($("chipBroker"), "브로커: 접속 중...", "");

  client = mqtt.connect(`wss://${BROKER_HOST}:8884/mqtt`, {
    username: $("user").value,
    password: $("pass").value,
    clientId: "web-" + Math.random().toString(16).slice(2, 10),
    reconnectPeriod: 3000,
    connectTimeout: 8000
  });

  client.on("connect", () => {
    setChip($("chipBroker"), "브로커: 연결됨", "ok");
    updateSummary();
    client.subscribe(["led/+/online", "led/+/state", "led/+/name", "led/+/schedule"]);
    $("pass").value = "";  // 비밀번호는 화면에 남기지 않는다
    showPanel(true);
  });

  client.on("message", onMessage);

  client.on("close", () => setChip($("chipBroker"), "브로커: 연결 끊김", "bad"));

  client.on("error", err => {
    // 4: 계정 이름/비밀번호 오류, 5: 권한 없음 -> 다시 시도해도 소용없으므로 중단
    if (err && (err.code === 4 || err.code === 5)) {
      $("msg").textContent = "계정 이름 또는 비밀번호가 틀렸습니다.";
      client.removeAllListeners();
      client.end(true);
      setChip($("chipBroker"), "브로커: 연결 안 됨", "bad");
      showPanel(false);
    }
  });
});

// 모두 끄기: 모든 기기가 함께 받는 토픽에 "0"을 보낸다 (색은 그대로)
$("allOff").addEventListener("click", () => {
  Object.values(devices).forEach(d => {
    d.touch = Date.now();
    d.on = false;
    paint(d);
  });
  publish(TOPIC_ALL_POWER, "0");
});

// 접속 끊기
$("logout").addEventListener("click", () => {
  if (client) {
    client.removeAllListeners();
    client.end(true);
  }
  clearDevices();
  setChip($("chipBroker"), "브로커: 연결 안 됨", "");
  setChip($("chipCount"), "기기: 확인 전", "");
  showPanel(false);
});

</script>
